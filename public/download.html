<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download File — Xerdown</title>
  <meta name="description" content="Secure file distribution powered by Xerdown infrastructure.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="liquid-grid-overlay"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <span class="brand-icon" id="brand-icon"></span>
        <span>Xer</span><span class="brand-accent">down</span>
      </a>
      <div class="navbar-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
      </div>
    </div>
  </nav>

  <!-- Download Content -->
  <main class="download-page">
    <div class="download-card">
      <div class="card" id="download-content">
        <div class="loading-state">
          <div class="spinner spinner-lg"></div>
          <p style="margin-top: 14px; font-weight: 600; color: var(--text-secondary);">Verifying file availability...</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer auth-page-footer">
      <p>
        Engineered by <a href="#">Mayank Mandrai</a> · Xerdown Platform
      </p>
    </footer>
  </main>

  <script src="/icons/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/download.js"></script>
  <script>
    document.getElementById('brand-icon').innerHTML = icon('bolt');
  </script>
</body>
</html>
